services:
  postgres:
    image: postgres:17
    container_name: ecommerce_api_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_network
volumes:
  postgres_data:

networks:
  ecommerce_network: